[project]
name = "matriblood-q-api"
version = "0.1.0"
description = "FastAPI + Qiskit decision service for MatriBlood Q"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "supabase>=2.7.0",
  "qiskit>=1.2.0",
  "qiskit-optimization>=0.6.1",
  "qiskit-algorithms>=0.3.0",
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]
